name: Monthly scores (Top 20)

on:
  schedule:
    - cron: "30 2 1 * *"   # 1st of every month, 8:00 am India time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python jobs/monthly_scores.py
      - name: Save the new scores
        run: |
          git config user.name "scores-bot"
          git config user.email "scores-bot@users.noreply.github.com"
          git add data/scores.json
          git diff --cached --quiet || git commit -m "Monthly scores update"
          git push
